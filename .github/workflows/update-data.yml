name: update-data

# Corre build_data.py (server-side, sin CORS): baja el CSV, lo pre-agrega y
# commitea data.json a la raíz del repo. La página lee data.json same-origin.

on:
  workflow_dispatch:            # botón "Run workflow" manual
  schedule:
    - cron: '*/5 * * * *'       # cada 5 min (best-effort de GitHub)

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar data.json
        run: python scripts/build_data.py

      - name: Commit si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "data: actualizacion automatica $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
